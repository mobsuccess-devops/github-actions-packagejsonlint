# https://github.com/mobsuccess-devops/github-mobsuccess-policy
name: Update Skills

on:
  # Propagate immediately when skills-hub master moves: skills-hub sends this
  # repository_dispatch on every push to its master.
  repository_dispatch:
    types: [skills-hub-updated]
  schedule:
    # Weekly (Monday morning) instead of daily: each run opens a skills PR on
    # every repo of the org, which triggers the whole policy + language CI suite.
    # Use workflow_dispatch to force an immediate update when needed.
    - cron: "0 9 * * 1"
      timezone: "Europe/Paris"
  workflow_dispatch:

jobs:
  update-skills:
    name: Update Skills
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get bot token
        id: get_token
        uses: actions/create-github-app-token@v3
        with:
          repositories: ${{ github.event.repository.name }},skills-hub
          owner: ${{ github.repository_owner }}
          client-id: ${{ secrets.MS_RENOVATE_APP_ID }}
          private-key: ${{ secrets.MS_RENOVATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7

      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${{ steps.get_token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Update skills
        id: update
        # skills-cli update (since the release with skills-cli#115) exits 1 when some
        # entries could not be checked against GitHub (unreachable private source, bad
        # token, rate limit), after updating every other entry, and reports them under
        # "could not be checked for updates". Only that case still opens the PR
        # (partial=true): any other failure (crash, npm error) may have left
        # half-written files. The last step fails the job either way.
        continue-on-error: true
        run: |
          if [ -f "ai-lock.json" ]; then
            echo "@mobsuccess-devops:registry=https://npm.pkg.github.com" >> ~/.npmrc
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.MS_READ_PACKAGES_GITHUB_PAT }}" >> ~/.npmrc
            log="$RUNNER_TEMP/skills-update.log"
            set +e
            GITHUB_TOKEN="${{ steps.get_token.outputs.token }}" npx --package=@mobsuccess-devops/skills-cli -- skills-cli update 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ] && grep -q "could not be checked for updates" "$log"; then
              echo "partial=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$status"
          else
            export GITHUB_TOKEN="${{ steps.get_token.outputs.token }}"
            SKILLS=$(node -e "
              const lock = require('./skills-lock.json');
              const names = Object.entries(lock.skills)
                .filter(([_, v]) => v.source === 'mobsuccess-devops/skills-hub')
                .map(([name]) => name);
              console.log(names.join(' '));
            ")
            if [ -n "$SKILLS" ]; then
              npx skills add mobsuccess-devops/skills-hub --skill $SKILLS --agent claude-code cursor --yes
            fi
          fi

      - name: Create PR if skills changed
        id: pr
        if: steps.update.outcome == 'success' || steps.update.outputs.partial == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.get_token.outputs.token }}
          commit-message: "chore(skills): update skills to latest versions"
          branch: chore/update-skills
          base: master
          title: "chore(skills): update skills to latest versions"
          body: |
            Automated update of skills to their latest versions.

            This PR was created automatically by the [daily skills update workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: automated
          delete-branch: true

      - name: Fail if the update reported errors
        if: steps.update.outcome == 'failure'
        env:
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          case "$PR_OPERATION" in
            created|updated) where="Entries that did update are in $PR_URL." ;;
            *) where="No pull request was opened." ;;
          esac
          echo "::error title=Skills update incomplete::skills-cli update failed: see the \"Update skills\" step log. $where"
          exit 1

# DO NOT EDIT: END
