name: Validate-YAML

on:
  merge_group:
    types:
      - checks_requested
  push:
    branches: [master, preprod, prod]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-yaml:
    name: Validate YAML files
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        # ubuntu-slim is a bare ubuntu:24.04 image, so yamllint is not
        # preinstalled. Pinned to the version ubuntu-latest ships, so the rule
        # set does not move under the fleet. --user targets ~/.local, which is
        # writable by the runner user and already on PATH; the job does not run
        # as root and cannot write to system site-packages.
        run: pip install --user --break-system-packages --quiet yamllint==1.38.0
      - name: Validate YAML files
        run: |
          if [ -f .yamllint.yml ]; then
            yamllint -c .yamllint.yml .
          elif [ -f .gitignore ]; then
            yamllint -d "{extends: relaxed, ignore-from-file: [.gitignore], rules: {line-length: disable}}" .
          else
            yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .
          fi

  notify:
    needs: [validate-yaml]
    if: failure()
    runs-on: ubuntu-slim
    steps:
      - name: Notify
        uses: mobsuccess-devops/github-actions-notify@master
        with:
          notify-type: "workflow-failure"
          slack-token: ${{ secrets.SLACK_TOKEN_MSBOT }}
          slack-channel: ${{ vars.SLACK_CHANNEL_NOTIFY_WORKFLOW_FAIL }}
          platform-pat: ${{ secrets.MS_PLATFORM_LIST_USERS_PAT }}
# DO NOT EDIT: END
